<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secret Page — For Afsa</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050308;
      --panel:#0b0710;
      --neon-pink: #ff4df0;
      --neon-purple: #8a3cff;
      --neon-cyan: #2ce7ff;
      --btn-pink: #ff69b4;
      --glass: rgba(255,255,255,0.06);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #040204 0%, #0a0610 100%);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    /* center panel */
    .secret-wrap{
      width:100%;
      max-width:880px;
      text-align:center;
      padding:48px 26px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 18px 60px rgba(10,6,20,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      position:relative;
    }

    /* lock icon circle */
    .lock-badge{
      width:70px;
      height:70px;
      margin:0 auto 12px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      box-shadow: 0 6px 30px rgba(138,60,255,0.12), 0 0 18px rgba(255,77,240,0.06);
      border: 1px solid rgba(255,255,255,0.03);
    }
    .lock-badge svg{ width:34px; height:34px; filter: drop-shadow(0 6px 14px rgba(138,60,255,0.25)); }

    /* neon heading */
    .secret-title{
      font-size:28px;
      font-weight:700;
      margin:6px 0 6px;
      color:var(--neon-purple);
      text-shadow:
        0 0 6px rgba(255,77,240,0.95),
        0 0 18px rgba(138,60,255,0.9),
        0 0 36px rgba(44,231,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .secret-sub{
      color: rgba(255,255,255,0.9);
      margin-bottom:18px;
      font-weight:600;
      opacity:0.95;
    }

    /* input + button row */
    .input-row{
      display:flex;
      gap:12px;
      justify-content:center;
      align-items:center;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .secret-input{
      min-width:320px;
      max-width: 60%;
      padding:14px 18px;
      border-radius:999px;
      border:0;
      outline:none;
      font-size:15px;
      background: #fff;
      color:#111;
      box-shadow: 0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.85);
    }

    .unlock-btn{
      padding:12px 20px;
      border-radius:999px;
      border:0;
      background: linear-gradient(90deg, var(--btn-pink), var(--neon-pink));
      color:#fff;
      font-weight:700;
      cursor:pointer;
      box-shadow:
        0 8px 30px rgba(255,77,240,0.14),
        0 6px 18px rgba(138,60,255,0.08),
        0 0 26px rgba(255,77,240,0.12);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .unlock-btn:active{ transform: translateY(1px) scale(.998) }
    .unlock-btn:focus{ outline: 3px solid rgba(138,60,255,0.15); }

    /* small caption under input */
    .hint{
      margin-top:12px;
      font-size:13px;
      color: rgba(255,255,255,0.7);
    }

    /* revealed content */
    .revealed{
      margin-top:24px;
      background: rgba(255,255,255,0.98);
      color:#111;
      padding:18px;
      border-radius:12px;
      max-width:700px;
      margin-left:auto;
      margin-right:auto;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      transform-origin: center top;
      animation: popIn .28s cubic-bezier(.2,.9,.3,1);
      text-align:left;
    }
    @keyframes popIn{
      from { opacity:0; transform: translateY(-8px) scale(.98); }
      to { opacity:1; transform: translateY(0) scale(1); }
    }

    /* small neon glow beneath panel */
    .secret-wrap::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-28px;
      transform:translateX(-50%);
      width:360px;height:28px;
      background: radial-gradient(closest-side, rgba(138,60,255,0.16), rgba(255,77,240,0.04));
      filter: blur(16px);
      opacity:0.9;
      border-radius:999px;
      pointer-events:none;
    }

    /* responsive */
    @media (max-width:620px){
      .secret-input{ min-width:220px; max-width:100%; }
      .secret-wrap{ padding:30px 18px; }
    }
  </style>
</head>
<body>

  <div class="secret-wrap" role="main" aria-labelledby="secretTitle">
    <div class="lock-badge" aria-hidden="true">
      <!-- simple lock SVG -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="3.5" y="10" width="17" height="11" rx="2.5" fill="url(#g1)"></rect>
        <path d="M7 10V7a5 5 0 0 1 10 0v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#ff77d8"/>
            <stop offset="1" stop-color="#8a3cff"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <h1 id="secretTitle" class="secret-title" style="gap:10px;">
      <span style="filter:drop-shadow(0 8px 20px rgba(138,60,255,0.25));">🔒</span>
      <span>Secret Page</span>
    </h1>

    <div class="secret-sub">Only Afsa is allowed here.</div>

    <div class="input-row" role="form" aria-label="Secret unlock form">
      <input id="secretInput" class="secret-input" type="password" placeholder="Enter secret password" aria-label="Secret password">
      <button id="unlockBtn" class="unlock-btn" aria-label="Unlock">Unlock</button>
    </div>

    <div class="hint" aria-hidden="true">Tip: type the special word and press Unlock (or Enter)</div>

    <!-- hidden content that will be revealed when password is correct -->
    <div id="secretMessage" class="revealed" style="display:none;" aria-hidden="true">
      <h3 style="margin-top:0;margin-bottom:8px">💖 My Promise to You</h3>
      <p style="margin:0 0 10px;line-height:1.5">
        Afsa, this website is proof that you matter to me more than words can explain.
        No matter where life takes us, I’ll always choose you as my best friend.
        Always.
      </p>
      <p style="margin:0;font-size:14px;color:#444">— Tarun</p>
    </div>
  </div>

  <script>
    (function(){
      const PASSWORD = "afsa123"; // change if you want
      const input = document.getElementById('secretInput');
      const btn = document.getElementById('unlockBtn');
      const message = document.getElementById('secretMessage');

      function unlock() {
        const val = (input.value || "").trim();
        if (!val) {
          input.focus();
          return;
        }
        if (val === PASSWORD) {
          // success: reveal content, hide input row softly
          message.style.display = 'block';
          message.setAttribute('aria-hidden','false');
          // visual success feedback
          btn.disabled = true;
          btn.style.transform = 'translateY(0)';
          input.value = '';
          input.setAttribute('aria-hidden','true');
          input.style.transition = 'opacity .2s ease';
          input.style.opacity = '0';
          setTimeout(()=> {
            input.style.display = 'none';
            btn.style.display = 'none';
          }, 220);
          // ensure message is visible
          message.scrollIntoView({behavior:'smooth', block:'center'});
        } else {
          // small shake and alert
          shake(input);
          // friendly hint
          alert('Wrong password 💔');
          input.value = '';
          input.focus();
        }
      }

      function shake(el){
        el.animate([
          { transform: 'translateX(0)' },
          { transform: 'translateX(-8px)' },
          { transform: 'translateX(6px)' },
          { transform: 'translateX(-4px)' },
          { transform: 'translateX(2px)' },
          { transform: 'translateX(0)' }
        ], { duration: 360, easing: 'cubic-bezier(.2,.9,.3,1)'});
      }

      btn.addEventListener('click', unlock);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          unlock();
        }
      });

      // accessibility: focus input initially
      input.focus();
    })();
  </script>
</body>
</html>
